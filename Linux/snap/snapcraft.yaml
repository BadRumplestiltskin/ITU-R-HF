# https://docs.snapcraft.io/snapcraft-yaml-reference/4276
name: iturhfprop # you probably want to 'snapcraft register <name>'
version: '0.1+git' # just for humans, typically '1.2+git' or '1.3.2'
summary: HF Propagation Prediction # 79 char long summary
description: |
  HF Propagation Prediction in accordance with ITU-R P.533-13.

grade: stable
confinement: strict

apps:
    iturhfprop:
        command: usr/bin/ITURHFProp
        plugs: [home]

parts:
  iturhfprop:
    # Build from the checkout this file lives in, not a fetched copy. The
    # project directory is Linux/ (it holds snap/), so its parent is the
    # repository root; the make plugin copies that into the part's build
    # directory and runs make there, so -C Linux is relative to it.
    source: ..
    plugin: make
    make-parameters:
        - 'prefix=/usr'
        - '-C'
        - 'Linux'
