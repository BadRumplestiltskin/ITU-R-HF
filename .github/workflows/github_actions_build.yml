name: Build

on: [push, pull_request]

jobs:
  buildUbuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: make
      run: |
        cd Linux
        make all
    - name: regression
      run: ./tests/regression.sh
    - name: smoke
      run: ./tests/smoke.sh
    - name: cases
      run: ./tests/cases.sh

  buildOSX:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v4
    - name: make
      run: |
        cd Linux
        make all
    - name: regression
      run: ./tests/regression.sh
    - name: smoke
      run: ./tests/smoke.sh
    - name: cases
      run: ./tests/cases.sh

  # Every suite again with AddressSanitizer and UndefinedBehaviorSanitizer:
  # memory errors and undefined behaviour the outputs alone would not show.
  # Any report makes the program exit non-zero, so the suites fail.
  sanitizeUbuntu:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
    - uses: actions/checkout@v4
    - name: make
      run: make -C Linux all OPTIMIZE=-O1 CC="gcc -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
    - name: regression
      run: ./tests/regression.sh
    - name: smoke
      run: ./tests/smoke.sh
    - name: cases
      run: ./tests/cases.sh

  buildWindows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build Solution
      run: |
        cd P372/Win32/ITURNoise
        msbuild /p:Configuration=Release /p:Platform="x86" ITURNoise.sln
        cd ../../..
        cd ITURHFProp/Win32/Combined
        msbuild /p:Configuration=Release /p:Platform="Win32" Combined.sln              